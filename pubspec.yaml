name: tu_cajon
description: "Tu Cajón: tus papeles importantes, guardados y siempre a la mano."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  camera: ^0.12.1
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  drift: ^2.35.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  image: ^4.10.1
  image_picker: ^1.2.3
  local_auth: ^3.0.2
  local_auth_android: ^2.2.0
  local_auth_darwin: ^2.0.4
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  permission_handler: 12.0.1
  share_plus: ^13.3.0
  sqlite3: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  # Plus Jakarta Sans va dentro de la app: nunca se descarga de internet.
  # Licencia libre (SIL OFL 1.1) en assets/fonts/OFL.txt.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# SQLite con cifrado (SQLite3MultipleCiphers). Ver lib/data/db/conexion_nativa.dart.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
